[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gtsim-frontend"
version = "0.1.0"
description = "Versioned layered IR for GTSim reference kernels"
requires-python = ">=3.10"

[project.scripts]
gtsim-ir = "gtsim_frontend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff==0.14.4", "clang-format==23.1.3"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Syntax/control-flow errors only; no unagreed broad stylistic lint rules.
select = ["E9", "F63", "F7", "F82"]

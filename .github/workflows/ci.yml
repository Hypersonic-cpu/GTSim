name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize required submodules
        run: >-
          git -c url.https://github.com/.insteadOf=git@github.com:
          submodule update --init --depth 1 -- 3rdparty/glaze 3rdparty/hbfine
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGTSIM_ENABLE_RAMULATOR2=OFF -DGTSIM_ENABLE_LEGACY_TVM_TESTS=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test and verify Core Beta references
        run: ctest --test-dir build -E '^workload_profile_boundary$' --output-on-failure

name: IR formatting
on:
  push:
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.4 clang-format==23.1.3
      - run: ruff format --check frontend/src/gtsim_frontend tests/ir_frontend tests/reference_parity
      - run: ruff check --select E9,F63,F7,F82 frontend/src/gtsim_frontend tests/ir_frontend tests/reference_parity
      - name: Check lifecycle C++ formatting
        run: |
          clang-format --dry-run --Werror include/runtime/kernel_execution_session.h src/runtime/kernel_execution_session.cpp include/simulator.h src/simulator.cpp include/tma.h src/runtime/program_executor.cpp
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check current IR documentation
        run: npx --yes prettier@3.6.2 --check docs/ir-framework-spec.md docs/ir-framework-implementation.md docs/ir-framework-compat.md docs/serving-ir/implementation-status.md docs/serving-ir/refactor-results/report.md

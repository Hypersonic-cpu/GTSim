name: IR formatting
on:
  push:
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.4 clang-format==23.1.3
      - run: ruff format --check frontend/src/ast frontend/src/parser frontend/src/compile frontend/tools
      - run: ruff check --select E9,F63,F7,F82 frontend/src/ast frontend/src/parser frontend/src/compile frontend/tools
      - name: Check all GTSim C/C++ formatting
        shell: bash
        run: |
          git ls-files -z -- src include \
            | grep -zE '\.(c|cc|cpp|cxx|cu|h|hh|hpp|hxx|cuh)$' \
            | xargs -0 -r clang-format --dry-run --Werror
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

# Derived from colocated-3F2M.yaml (3 HBF + 2 HBM stacks).
# Three HBM stacks: 3/2 of original HBM bandwidth; two HBF: 2/3 of original HBF.
# Per-stack UCIe effective bandwidth remains 1536 GB/s. Decimal GB/s throughout.
# Latencies and queue capacities are unchanged: 1980 MHz, HBF 4 us / 75 us.
topology: CoLocated

hbm:
  read_bw_GBps: 1860
  write_max_bw_GBps: 930
  read_latency_cycles: 270
  write_latency_cycles: 270

hbf:
  read_bw_GBps: 1048.576
  write_bw_GBps: 55.92
  read_latency_cycles: 7920
  write_latency_cycles: 148500

d2dlink:
  gpu_to_hbm:
    bandwidth_GBps: 4608
    latency_cycles: 10
  gpu_to_hbf:
    bandwidth_GBps: 3072
    latency_cycles: 10

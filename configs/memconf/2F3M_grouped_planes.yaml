# H100 SXM CoLocated package. HBM uses the three-stack Ramulator2 HBM3 profile.
# HBF NAND ceiling: 786.432 GB/s/stack. Read target: 768 GB/s/stack.
# UCIe Grade 2 links: 1536 GB/s per stack. All bandwidth units are decimal.
topology: CoLocated
hbm:
  backend: ramulator2
  stacks: 3
  read_bw_GBps: 1860
  write_max_bw_GBps: 930
  ramulator:
    config_file: ../ramulator/h100_hbm3_3stack.yaml
    stacks: 3
hbf:
  backend: bank_plane
  read_bw_GBps: 1536
  # Nominal array program ceiling, required by the schema. Programming disabled.
  write_bw_GBps: 83.88608
  read_latency_cycles: 7920
  write_latency_cycles: 148500
  controller:
    geometry: grouped_planes
    stacks: 2
    dies_per_stack: 8
    planes_per_die: 96
    planes_per_command_group: 32
    banks_per_channel: 48
    planes_per_bank: 1
    blocks_per_plane: 342
    pages_per_block: 192
    read_target_GBps_per_stack: 768
    write_target_GBps_per_stack: 41.94304
    sense_latency_us: 4
    program_latency_us: 75
    allow_program: false
    sram_bytes_per_plane: 32768
    base_die_sram_bytes_per_stack: 8388608
d2dlink:
  gpu_to_hbm:
    bandwidth_GBps: 4608
    latency_cycles: 10
  gpu_to_hbf:
    bandwidth_GBps: 3072
    latency_cycles: 10
address_layout:
  enabled: true
  hbm_base: 0
  hbm_capacity_bytes: 51539607552
  hbf_base: 51539607552
  hbf_capacity_bytes: 413122166784
  hbm_allocation_offset: 0

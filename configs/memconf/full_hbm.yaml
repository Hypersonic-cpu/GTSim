# Stack allocation: 0 HBF, 5 HBM. Bandwidths are decimal GB/s.
# HBM uses the original 270-cycle latency and 3100/1550 GB/s at 5 stacks.
# UCIe Grade 2 effective bandwidth is 1536 GB/s per stack; rates are aggregated.
# There are no HBF stacks, so HBF bandwidth is zero; latency fields retain the per-stack timing.
# At 1980 MHz, 4 us = 7920 cycles and 75 us = 148500 cycles.
topology: FullHBM

hbm:
  read_bw_GBps: 3100
  write_max_bw_GBps: 1550
  read_latency_cycles: 270
  write_latency_cycles: 270

hbf:
  read_bw_GBps: 0
  write_bw_GBps: 0
  read_latency_cycles: 7920
  write_latency_cycles: 148500

d2dlink:
  gpu_to_hbm:
    bandwidth_GBps: 7680
    latency_cycles: 10

# Bandwidths are decimal GB/s; latencies are GPU core cycles.
topology: CoLocated

hbm:
  read_bw_gbps: 3100
  write_max_bw_gbps: 1550
  read_latency_cycles: 270
  write_latency_cycles: 270

hbf:
  read_bw_gbps: 1500
  write_bw_gbps: 100
  read_latency_cycles: 40000
  write_latency_cycles: 150000

d2dlink:
  # Example two-HBM-stack, three-HBF-stack allocation (of five stacks).
  gpu_to_hbm:
    bandwidth_gbps: 1240
    latency_cycles: 10
  gpu_to_hbf:
    bandwidth_gbps: 900
    latency_cycles: 10

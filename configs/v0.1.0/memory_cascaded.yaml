# Bandwidths are decimal GB/s; latencies are GPU core cycles.
topology: Cascaded

hbm:
  read_bw_gbps: 3100
  write_max_bw_gbps: 1550
  read_latency_cycles: 270
  write_latency_cycles: 270

hbf:
  read_bw_gbps: 1500
  write_bw_gbps: 100
  read_latency_cycles: 40000
  write_latency_cycles: 150000

d2dlink:
  # Shared GPU-to-HBM-base-die path for HBM and HBF requests.
  gpu_to_hbm:
    bandwidth_gbps: 3100
    latency_cycles: 10
  hbm_to_hbf:
    bandwidth_gbps: 1500
    latency_cycles: 10

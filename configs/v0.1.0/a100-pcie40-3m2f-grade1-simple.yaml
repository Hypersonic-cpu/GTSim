# Research assumption, not a guaranteed Grade-1 NAND specification.
# HBM: A100 5-stack aggregate scaled by 3/5 (311 GB/s per stack).
# HBF: existing 16-Hi Simple rates 524.288/27.96 GB/s scaled by 8/16.
# Two HBF stacks: 524.288 GB/s read, 27.96 GB/s write.
# Grade-1 host-link ceiling: 384 GB/s per stack, 768 aggregate.
# NAND read/program latency assumptions 4/75 us -> 5640/105750 cycles @1410 MHz.
name: A100 compute with 3 HBM stacks and 2 Grade-1 HBF stacks (Simple)
source: NVIDIA A100 product brief and Ampere tuning guide; uncalibrated timing assumptions documented in report
